<main class="inicio" id="inicio">
  <section class="hero" aria-labelledby="titulo-principal">

      <img class="hero__imagen hero__imagen--color" src="assets/imagenes/mikasa.jpg" alt="" />
      <img class="hero__imagen hero__imagen--gris" src="assets/imagenes/mikasa.jpg" alt="" />
      <img class="hero__imagen hero__imagen--ojos" src="assets/imagenes/mikasa.jpg" alt="" />

      <div class="hero__cortina hero__cortina--superior" aria-hidden="true"></div>
