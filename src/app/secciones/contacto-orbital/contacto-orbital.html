<section class="contacto-orbital" id="contacto" aria-label="Contacto">
  <div class="contacto-orbital__contenido">
    <p class="contacto-orbital__rotulo">CONTACTO</p>

    <div class="contacto-orbital__escena">
      <ul class="contacto-orbital__lista" aria-label="Opciones de contacto">
        @for (contacto of contactos; track contacto.id) {
          <li class="contacto-orbital__item" [style.--retraso-contacto]="contacto.retrasoAnimacion">
            @switch (contacto.tipo) {
              @case ('enlace') {
                <a
                  class="contacto-orbital__accion"
                  [href]="contacto.url"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.aria-label]="contacto.ariaLabel"
                  [attr.title]="contacto.tooltip"
                >
                  <img [src]="contacto.icono" alt="" aria-hidden="true" />
                </a>
              }
              @case ('copiar') {
                <button
                  class="contacto-orbital__accion"
                  type="button"
                  aria-describedby="contacto-estado"
                  [attr.aria-label]="contacto.ariaLabel"
                  [attr.title]="contacto.tooltip"
                  (click)="copiarDiscord(contacto)"
                >
                  <img [src]="contacto.icono" alt="" aria-hidden="true" />
                </button>
              }
              @default {
                <button
                  class="contacto-orbital__accion contacto-orbital__accion--pendiente"
                  type="button"
                  disabled
                  [attr.aria-label]="contacto.ariaLabel"
                  [attr.title]="contacto.tooltip"
                >
                  <img [src]="contacto.icono" alt="" aria-hidden="true" />
                </button>
              }
            }
          </li>
        }
      </ul>

      <span class="contacto-orbital__mascara" aria-hidden="true"></span>

      <div class="contacto-orbital__bailarina" aria-hidden="true">
        <img src="assets/imagenes/bailarina-contacto.gif" alt="" />
      </div>

      <span class="contacto-orbital__estado" id="contacto-estado" aria-live="polite">{{ mensajeCopiado() }}</span>
    </div>
  </div>
</section>
